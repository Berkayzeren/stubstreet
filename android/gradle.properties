# Gradle daemon bellek ayarları - optimize edildi
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dfile.encoding=UTF-8

# Android X ayarları
android.useAndroidX=true
android.enableJetifier=true

# Performans optimizasyonları
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin daemon bellek ayarları
kotlin.daemon.jvmargs=-Xmx4096m

# R8 optimizasyonları
android.enableR8.fullMode=true
